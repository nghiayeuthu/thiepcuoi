<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tạo link mời khách</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Be+Vietnam+Pro:wght@300;400;500&display=swap">
<style>
:root{--paper:#f8f1ef;--paper-2:#f1e5e2;--ink:#2b2427;--ink-soft:#6d5f63;--seal:#b33a2e;--gold:#a2875a;--line:#e2d3cf;
  --f-display:"Cormorant Garamond","Times New Roman",serif;--f-body:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:300 15px/1.6 var(--f-body);padding:32px 16px 48px}
main{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.15;margin:0}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0}
p{margin:0;color:var(--ink-soft)}
label{font-weight:500;font-size:13px}
textarea{width:100%;min-height:150px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;font:400 15px/1.6 var(--f-body);color:var(--ink);resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{padding:10px 18px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 13px/1 var(--f-body);cursor:pointer}
button.solid{background:var(--ink);color:var(--paper)}
button:hover{background:var(--seal);border-color:var(--seal);color:#fff}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
li div{min-width:0}
li b{display:block;font-weight:500}
li a{display:block;font-size:12px;color:var(--ink-soft);overflow-wrap:anywhere}
li button{padding:8px 14px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:6px;text-align:center}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Thiệp cưới Tuấn Nghĩa &amp; Hoài Thu</p>
  <h1>Tạo link mời riêng từng khách</h1>
  <p>Gõ cách xưng hô và tên khách, mỗi người một dòng. Khi khách mở link, thiệp sẽ hiện “Thân gửi” kèm tên đó.</p>
  <label for="names">Danh sách khách mời</label>
  <textarea id="names" placeholder="Anh Hùng&#10;Chị Lan và gia đình&#10;Cô Mai, chú Bình"></textarea>
  <div class="row">
    <button class="solid" type="button" id="make">Tạo link</button>
    <button type="button" id="copyAll">Sao chép tất cả</button>
  </div>
  <ul id="out"><li class="empty" style="display:block">Danh sách link sẽ hiện ở đây.</li></ul>
</main>
<script>
var base=new URL('./',location.href).href, out=document.getElementById('out'), ta=document.getElementById('names'), links=[];
try{ta.value=localStorage.getItem('guests')||''}catch(e){}
function copy(text,btn,label){
  function ok(){btn.textContent='Đã chép';setTimeout(function(){btn.textContent=label},1500)}
  try{navigator.clipboard.writeText(text).then(ok,function(){prompt('Sao chép link:',text)})}catch(e){prompt('Sao chép link:',text)}
}
function make(){
  try{localStorage.setItem('guests',ta.value)}catch(e){}
  var names=ta.value.split('\n').map(function(s){return s.replace(/\s+/g,' ').trim()}).filter(Boolean);
  links=names.map(function(n){return{n:n,u:base+'?to='+encodeURIComponent(n)}});
  out.innerHTML='';
  if(!links.length){out.innerHTML='<li class="empty" style="display:block">Chưa có tên nào.</li>';return}
  links.forEach(function(l){
    var li=document.createElement('li'),d=document.createElement('div'),b=document.createElement('b'),a=document.createElement('a'),btn=document.createElement('button');
    b.textContent=l.n;a.href=l.u;a.target='_blank';a.textContent=l.u;btn.type='button';btn.textContent='Sao chép';
    btn.onclick=function(){copy(l.u,btn,'Sao chép')};
    d.append(b,a);li.append(d,btn);out.appendChild(li);
  });
}
document.getElementById('make').onclick=make;
document.getElementById('copyAll').onclick=function(){if(!links.length)make();if(links.length)copy(links.map(function(l){return l.n+': '+l.u}).join('\n'),this,'Sao chép tất cả')};
if(ta.value)make();
</script>
</body>
</html>
